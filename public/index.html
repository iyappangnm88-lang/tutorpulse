<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuzigo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #FAFBEF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #172B4D;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #55C832;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(85, 200, 50, 0.3);
    }
    .logo-container img {
      width: 52px;
      height: 52px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #172B4D;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #6B778C;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 28px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(85, 200, 50, 0.2);
      border-top-color: #55C832;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/icons/icon-192x192.png" alt="Nuzigo Logo" />
  </div>
  <h1>Nuzigo</h1>
  <p>Connecting to your classroom &amp; dashboard...</p>
  <div class="spinner"></div>
</body>
</html>
